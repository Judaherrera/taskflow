# CI — Integración continua
# Se ejecuta en cada push a las ramas de GitFlow y en cada Pull Request.
# Si algún job falla, la PR no se puede fusionar (con protección de ramas activa).
name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

# Si haces otro push a la misma rama, cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1) Calidad de código: lint + tests unitarios
  lint-and-test:
    name: Lint y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: api/coverage
          retention-days: 7

  # 2) Docker: construir imágenes y probar el stack completo con Compose
  docker:
    name: Build y prueba con Docker Compose
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      - name: Ejecutar tests dentro de la imagen (etapa "test")
        run: docker build --target test ./api

      - name: Levantar el stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Smoke test (frontend → API → BD)
        run: |
          curl -fsS http://localhost:8080/ | grep -q "TaskFlow"
          curl -fsS http://localhost:8080/api/health | grep -q '"db":"up"'
          curl -fsS -X POST http://localhost:8080/api/tasks \
               -H "Content-Type: application/json" -d '{"title":"tarea desde CI"}'
          curl -fsS http://localhost:8080/api/tasks | grep -q "tarea desde CI"
          echo "✅ El stack responde correctamente"

      - name: Logs si algo falla
        if: failure()
        run: docker compose logs

      - name: Apagar el stack
        if: always()
        run: docker compose down -v
