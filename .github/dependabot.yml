# Dependabot abre PRs automáticas cuando hay actualizaciones de dependencias.
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly }
    target-branch: develop
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly }
    target-branch: develop
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    target-branch: develop
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
