# ---------------------------------------------------------------
# TaskFlow — orquestación de 3 servicios con Docker Compose
#
#   [navegador] --:8080--> frontend (Nginx) --red frontend--> api (Node)
#                                                   api --red backend--> db (PostgreSQL)
#
# - La BD está en una red "internal": no tiene salida a internet ni
#   puerto publicado, solo la API puede hablar con ella.
# - Los datos de PostgreSQL viven en un volumen con nombre (persisten
#   aunque se borren los contenedores).
# ---------------------------------------------------------------
name: taskflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskflow}
      POSTGRES_DB: ${DB_NAME:-taskflow}
    volumes:
      - pgdata:/var/lib/postgresql/data                       # volumen con nombre: persistencia
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro # bind mount: script inicial (solo lectura)
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskflow} -d ${DB_NAME:-taskflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      target: runtime
    image: taskflow-api:local
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db            # nombre del servicio = hostname dentro de la red
      DB_PORT: 5432
      DB_USER: ${DB_USER:-taskflow}
      DB_PASSWORD: ${DB_PASSWORD:-taskflow}
      DB_NAME: ${DB_NAME:-taskflow}
    depends_on:
      db:
        condition: service_healthy   # espera a que PostgreSQL acepte conexiones
    networks:
      - frontend
      - backend

  frontend:
    build: ./frontend
    image: taskflow-frontend:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"     # único puerto expuesto al host
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  pgdata:
