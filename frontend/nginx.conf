# Nginx cumple dos funciones:
#  1. Sirve el frontend estático (HTML/CSS/JS)
#  2. Actúa como reverse proxy: las peticiones a /api/ se reenvían al
#     contenedor "api" usando su nombre de servicio (DNS interno de Docker).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Endpoint propio para el healthcheck del contenedor
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
